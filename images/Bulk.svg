<svg 
    xmlns="http://www.w3.org/2000/svg"
    xmlns:xlink="https://www.w3.org/1999/xlink"
    width="20" 
    height="30"
    preserveAspectRatio="none"
    viewBox="0 0 20 30"
>
<path d="M0 0 L0 30 L20 30 L20 0 Z" style="fill:none; stroke:black; stroke-width: 3" />
<pattern id="diagonalHatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
  <line x1="0" y1="0" x2="0" y2="30" style="stroke:black; stroke-width:1" />
  <line x1="0" y1="0" x2="20" y2="0" style="stroke:black; stroke-width:1" />
</pattern>
<rect x="0" y="0" width="100%" height="100%" fill="url(#diagonalHatch)"/>
</svg>